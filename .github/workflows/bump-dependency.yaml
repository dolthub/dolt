name: Bump Deps

on:
  repository_dispatch:
    types: [ bump-dependency ]

concurrency:
  group: bump-dependency-${{ github.event.client_payload.dependency }}
  cancel-in-progress: false

jobs:
  sanitize-payload:
    name: Sanitize Payload
    runs-on: ubuntu-22.04
    outputs:
      label:        ${{ steps.sanitize.outputs.label }}
      safe_module:  ${{ steps.sanitize.outputs.safe_module }}
      safe_head:    ${{ steps.sanitize.outputs.safe_head }}
      safe_assignee: ${{ steps.sanitize.outputs.safe_assignee }}
      safe_email:   ${{ steps.sanitize.outputs.safe_email }}
      safe_branch:  ${{ steps.sanitize.outputs.safe_branch }}
      safe_short:   ${{ steps.sanitize.outputs.safe_short }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate & Sanitize Payload (script)
        id: sanitize
        env:
          RAW_DEP:  ${{ github.event.client_payload.dependency }}
          RAW_SHA:  ${{ github.event.client_payload.head_commit_sha }}
          RAW_USER: ${{ github.event.client_payload.assignee }}
          RAW_MAIL: ${{ github.event.client_payload.assignee_email }}
        run: bash .github/scripts/sanitize_payload.sh

  stale-bump-prs:
    name: Retrieving Stale Bump PRs
    needs: sanitize-payload
    outputs:
      stale-pulls: ${{ steps.get-stale-prs.outputs.open-pulls }}
    runs-on: ubuntu-22.04
    steps:
      - name: Get Open Bump PRs
        id: get-stale-prs
        uses: actions/github-script@v7
        env:
          LABEL: ${{ needs.sanitize-payload.outputs.label }}
        with:
          debug: true
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          script: |
            try {
              const { LABEL } = process.env;
              const { owner, repo } = context.repo;
              const res = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                sort: 'created',
                direction: 'desc',
              });

              const { data } = res;

              const reduced = data.reduce((acc, p) => {
                if (p.labels.length < 1) return acc;

                let keepAlive = false;
                let shouldPush = false;

                for (const label of p.labels) {
                  if (label.name === LABEL) {
                    shouldPush = true;
                  }
                  if (label.name === "keep-alive") {
                    keepAlive = true;
                  }
                }
                if (shouldPush) {
                  acc.push({
                    number: p.number,
                    keepAlive,
                    headRef: p.head.ref,
                  });
                }
                return acc;
              }, []);

              console.log(reduced);
              if (reduced.length > 0) core.setOutput("open-pulls", JSON.stringify(reduced));
              process.exit(0);
            } catch(err) {
              console.log("Error:", err);
              process.exit(1);
            }

  open-bump-pr:
    needs: [sanitize-payload, stale-bump-prs]
    name: Open Bump PR
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      latest-pr: ${{ steps.latest-pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Bump dependency (safe)
        working-directory: go
        env:
          SAFE_MODULE:   ${{ needs.sanitize-payload.outputs.safe_module }}
          SAFE_HEAD:     ${{ needs.sanitize-payload.outputs.safe_head }}
        run: |
          GOOS=linux go get "${SAFE_MODULE}@${SAFE_HEAD}"
          go mod tidy
      - name: Create and Push new branch (safe)
        id: bump-commit
        env:
          GIT_USER:  ${{ needs.sanitize-payload.outputs.safe_assignee }}
          GIT_MAIL:  ${{ needs.sanitize-payload.outputs.safe_email }}
          BRANCH:    ${{ needs.sanitize-payload.outputs.safe_branch }}
          COMMIT_BY: ${{ needs.sanitize-payload.outputs.safe_assignee }}
        run: |
          set -euo pipefail
          git config --global user.name "${GIT_USER}"
          git config --global user.email "${GIT_MAIL}"
          git checkout -b "${BRANCH}"
          git add .
          git commit -m "[ga-bump-dep] Bump dependency in Dolt by ${COMMIT_BY}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin "${BRANCH}"
      - name: pull-request
        uses: repo-sync/pull-request@v2
        id: latest-pr
        with:
          source_branch: ${{ needs.sanitize-payload.outputs.safe_branch }}
          destination_branch: "main"
          github_token: ${{ secrets.REPO_ACCESS_TOKEN }}
          pr_title: "[auto-bump] [no-release-notes] dependency by ${{ needs.sanitize-payload.outputs.safe_assignee }}"
          pr_template: ".github/markdown-templates/dep-bump.md"
          pr_assignee: ${{ needs.sanitize-payload.outputs.safe_assignee }}
          pr_label: ${{ needs.sanitize-payload.outputs.label }}
      - name: Validate and approve pull request
        uses: actions/github-script@v7
        env:
          EXPECTED_BRANCH: ${{ needs.sanitize-payload.outputs.safe_branch }}
          EXPECTED_LABEL: ${{ needs.sanitize-payload.outputs.label }}
          EXPECTED_SHA: ${{ steps.bump-commit.outputs.sha }}
          PR_URL: ${{ steps.latest-pr.outputs.pr_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { EXPECTED_BRANCH, EXPECTED_LABEL, EXPECTED_SHA, PR_URL } = process.env;
            const match = PR_URL.match(/\/pull\/(\d+)$/);
            if (!match) throw new Error(`Unable to determine pull request number from ${PR_URL}`);

            const pull_number = Number(match[1]);
            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });

            if (pull.state !== "open") throw new Error("Pull request is not open");
            if (pull.base.ref !== "main") throw new Error(`Unexpected base branch: ${pull.base.ref}`);
            if (pull.head.repo?.full_name !== `${owner}/${repo}`) throw new Error("Pull request head is from a fork");
            if (pull.head.ref !== EXPECTED_BRANCH) throw new Error(`Unexpected head branch: ${pull.head.ref}`);
            if (pull.head.sha !== EXPECTED_SHA) throw new Error(`Unexpected head SHA: ${pull.head.sha}`);
            if (!pull.labels.some(({ name }) => name === EXPECTED_LABEL)) {
              throw new Error(`Pull request is missing expected label: ${EXPECTED_LABEL}`);
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const allowed = new Set(["go/go.mod", "go/go.sum"]);
            const unexpected = files.filter(({ filename }) => !allowed.has(filename));
            if (!files.some(({ filename }) => filename === "go/go.mod")) {
              throw new Error("Dependency bump did not change go/go.mod");
            }
            if (unexpected.length > 0) {
              throw new Error(`Unexpected changed files: ${unexpected.map(({ filename }) => filename).join(", ")}`);
            }

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              commit_id: EXPECTED_SHA,
              event: "APPROVE",
              body: "Automated approval: validated dependency-only update.",
            });
      - name: Disable auto-merge on superseded pull requests
        if: ${{ needs.stale-bump-prs.outputs.stale-pulls != '' }}
        uses: actions/github-script@v7
        env:
          STALE_PULLS: ${{ needs.stale-bump-prs.outputs.stale-pulls }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pulls = JSON.parse(process.env.STALE_PULLS);

            for (const { number, keepAlive } of pulls) {
              if (keepAlive) continue;
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: number,
              });
              if (!pull.auto_merge) continue;

              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                    pullRequest { number }
                  }
                }
              `, { pullRequestId: pull.node_id });
            }
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.bump-commit.outputs.sha }}
          PR_URL: ${{ steps.latest-pr.outputs.pr_url }}
        run: gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"

  comment-on-stale-prs:
    needs: [open-bump-pr, stale-bump-prs]
    if: ${{ needs.stale-bump-prs.outputs.stale-pulls != '' }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        pull: ${{ fromJson(needs.stale-bump-prs.outputs.stale-pulls) }}
    steps:
      - name: Comment/Close Stale PRs
        id: get-stale-prs
        uses: actions/github-script@v7
        env:
          PULL: ${{ toJson(matrix.pull) }}
          SUPERSEDED_BY: ${{ needs.open-bump-pr.outputs.latest-pr }}
        with:
          debug: true
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          script: |
            try {
              const { owner, repo } = context.repo;
              const { PULL, SUPERSEDED_BY } = process.env;
              const pull = JSON.parse(PULL);

              if (pull.keepAlive) process.exit(0);

              console.log(`Closing open pr ${pull.number}`);
              await github.rest.issues.createComment({
                issue_number: pull.number,
                owner,
                repo,
                body: `This PR has been superseded by ${SUPERSEDED_BY}`
              });

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pull.number,
                state: 'closed',
              });

              process.exit(0);
            } catch(err) {
              console.log("Error:", err);
              process.exit(1);
            }
