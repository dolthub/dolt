name: PR CI admission

on:
  workflow_call:
    outputs:
      run:
        description: Whether the CI jobs can start
        value: ${{ jobs.admission.outputs.run }}
      suites:
        description: Suites selected by the original PR event and changed files
        value: ${{ jobs.admission.outputs.suites }}

permissions:
  contents: read
  pull-requests: read

jobs:
  admission:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.admission.outputs.run }}
      suites: ${{ steps.admission.outputs.suites }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci-scheduling
      - name: Check admission
        id: admission
        uses: actions/github-script@v7
        env:
          CI_TIMEZONE: ${{ vars.CI_TIMEZONE || 'America/Los_Angeles' }}
        with:
          script: |
            const { admission } = require('./.github/scripts/ci-scheduling');
            const decision = await admission({ github, context, timezone: process.env.CI_TIMEZONE });
            core.setOutput('run', String(decision.run));
            core.setOutput('reason', decision.reason);
            const { selection } = require('./.github/scripts/ci-scheduling/selection');
            core.setOutput('suites', JSON.stringify(decision.run && context.eventName === 'pull_request'
              ? await selection({ github, context }) : {}));
      # The controller reads this step from the original run's latest attempt.
      - name: CI postponed
        if: steps.admission.outputs.reason == 'deferred'
        run: echo 'CI postponed by draft status or a deferral label. See the PR scheduling comment for outstanding conditions and overrides.' >> "$GITHUB_STEP_SUMMARY"
