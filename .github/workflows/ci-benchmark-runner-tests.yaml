name: Test Benchmark Runner Utility Works

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'go/**'
      - 'integration-tests/**'

concurrency:
  group: ci-benchmark-runner-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-admission:
    uses: ./.github/workflows/ci-admission.yaml
    permissions:
      contents: read
      pull-requests: read

  benchmark_runner:
    if: ${{ needs.ci-admission.outputs.run == 'true' }}
    needs: ci-admission
    runs-on: ubuntu-22.04
    name: Test Benchmark Runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Copy Dockerfile
        run: cp -r ./go/performance/continuous_integration/. .
      - name: Test runner
        uses: ./.github/actions/benchmark-runner-tests
