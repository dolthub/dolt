name: Multi-branch transaction concurrency

on:
  pull_request:
    branches: [ main ]
    paths:
      - "go/**"
      - "integration-tests/go-sql-server-driver/**"
      - ".github/workflows/ci-multi-branch-concurrency.yaml"
  workflow_dispatch:

concurrency:
  group: ci-multi-branch-concurrency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [11928, 8675309, 20261016]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go-toolchain
      - name: Build dolt
        uses: ./.github/actions/build-dolt
      - name: Exercise concurrent multi-branch transactions
        working-directory: integration-tests/go-sql-server-driver
        env:
          DOLT_CONCURRENCY_SEED: ${{ matrix.seed }}
        run: go test -v -count=3 -timeout=20m -run '^TestConcurrentMultiBranch' .
