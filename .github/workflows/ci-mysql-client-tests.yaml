name: Test MySQL Client integrations

on:
  pull_request:
    paths:
      - 'go/**'
      - 'integration-tests/**'

concurrency:
  group: ci-mysql-client-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql_client_integrations:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout CI admission
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: .ci-admission
          sparse-checkout: .github/scripts/ci-scheduling
      - name: Check CI admission
        id: ci-admission
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CI_TIMEZONE: ${{ vars.CI_TIMEZONE || 'America/Los_Angeles' }}
        with:
          script: |
            const { admission } = require(process.env.GITHUB_WORKSPACE + '/.ci-admission/.github/scripts/ci-scheduling');
            const decision = await admission({ github, context, timezone: process.env.CI_TIMEZONE });
            core.setOutput('run', String(decision.run));
            core.setOutput('reason', decision.reason);
      - name: CI postponed
        if: steps.ci-admission.outputs.reason == 'deferred'
        uses: actions/github-script@v7
        with:
          script: |
            await core.summary.addRaw('CI postponed. See the PR comment for conditions and overrides.').write();
      - name: Cancel deferred CI
        if: github.event_name == 'pull_request' && steps.ci-admission.outputs.run == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { cancelFromJob } = require(process.env.GITHUB_WORKSPACE + '/.ci-admission/.github/scripts/ci-scheduling');
            await cancelFromJob({ github, context, core });
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: dolt
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Free disk space
        run: |
          NAME="DISK-CLEANUP"
          echo "[${NAME}] Starting background cleanup..."
          [ -d "$AGENT_TOOLSDIRECTORY" ] && sudo rm -rf "$AGENT_TOOLSDIRECTORY" &
          [ -d /usr/share/dotnet ] && sudo rm -rf /usr/share/dotnet &
          [ -d /usr/local/lib/android ] && sudo rm -rf /usr/local/lib/android &
          [ -d /opt/ghc ] && sudo rm -rf /opt/ghc &
          [ -d /usr/local/share/boost ] && sudo rm -rf /usr/local/share/boost &
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Ensure cache directory exists
        run: |
          sudo mkdir -p /mnt/.buildx-cache
          sudo chown $USER:$USER /mnt/.buildx-cache
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /mnt/.buildx-cache
          key: ${{ runner.os }}-docker-mysql-client-integrations
          restore-keys: |
            ${{ runner.os }}-docker
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Build MySQL test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dolt/integration-tests/mysql-client-tests/Dockerfile
          tags: mysql-client-tests:latest
          load: true
          cache-from: type=local,src=/mnt/.buildx-cache
          cache-to: type=local,dest=/mnt/.buildx-cache
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Test MySQL client integrations
        run: docker run --rm mysql-client-tests:latest
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}
