name: PR CI label checks

on:
  pull_request:
    branches: [main]
    paths: ["go/**"]
    types: [opened, synchronize, labeled, unlabeled]

# No parent cancellation: label updates must not cancel unrelated tests.
# Suite workflows retain their existing per-PR concurrency groups.
jobs:
  ci-admission:
    uses: ./.github/workflows/ci-admission.yaml
    permissions:
      contents: read
      pull-requests: read

  ci-check-correctness:
    needs: ci-admission
    if: needs.ci-admission.outputs.run == 'true' && fromJSON(needs.ci-admission.outputs.suites)['ci-check-correctness']
    uses: ./.github/workflows/ci-check-correctness.yaml
    secrets: inherit
    permissions:
      issues: write
      pull-requests: write

  ci-check-performance:
    needs: ci-admission
    if: needs.ci-admission.outputs.run == 'true' && fromJSON(needs.ci-admission.outputs.suites)['ci-check-performance']
    uses: ./.github/workflows/ci-check-performance.yaml
    secrets: inherit
    permissions:
      issues: write
      pull-requests: write
