name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# No parent cancellation: label updates must not cancel unrelated tests.
# Suite workflows retain their existing per-PR concurrency groups.
jobs:
  ci-admission:
    uses: ./.github/workflows/ci-admission.yaml
    permissions:
      contents: read
      pull-requests: read

  ci-bats-unix-remote:
    needs: ci-admission
    if: needs.ci-admission.outputs.run == 'true' && fromJSON(needs.ci-admission.outputs.suites)['ci-bats-unix-remote']
    uses: ./.github/workflows/ci-bats-unix-remote.yaml
    secrets: inherit

  ci-bats-unix:
    needs: ci-admission
    if: needs.ci-admission.outputs.run == 'true' && fromJSON(needs.ci-admission.outputs.suites)['ci-bats-unix']
    uses: ./.github/workflows/ci-bats-unix.yaml
    secrets: inherit

  ci-benchmark-runner-tests:
