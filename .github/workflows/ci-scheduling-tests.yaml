name: Test CI scheduling

on:
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check deferred CI
        uses: $/.github/actions/check-deferred-ci
        with:
          timezone: ${{ vars.CI_TIMEZONE || 'America/Los_Angeles' }}
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix .github/actions/check-deferred-ci
      - run: npm test --prefix .github/actions/check-deferred-ci
