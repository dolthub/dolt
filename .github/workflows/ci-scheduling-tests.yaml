name: Test CI scheduling

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix .github/scripts/ci-scheduling
      - run: npm test --prefix .github/scripts/ci-scheduling
