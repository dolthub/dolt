name: Test Integration with DoltgreSQL

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  issue_comment:
    types: [ created, edited, deleted ]

jobs:
  test-integration:
    if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != '' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI admission
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: .ci-admission
          sparse-checkout: .github/scripts/ci-scheduling
      - name: Check CI admission
        id: ci-admission
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CI_TIMEZONE: ${{ vars.CI_TIMEZONE || 'America/Los_Angeles' }}
        with:
          script: |
            const { admission } = require(process.env.GITHUB_WORKSPACE + '/.ci-admission/.github/scripts/ci-scheduling');
            const decision = await admission({ github, context, timezone: process.env.CI_TIMEZONE });
            core.setOutput('run', String(decision.run));
            core.setOutput('reason', decision.reason);
      - name: CI postponed
        if: steps.ci-admission.outputs.reason == 'deferred'
        uses: actions/github-script@v7
        with:
          script: |
            await core.summary.addRaw('CI postponed. See the PR comment for conditions and overrides.').write();
      - name: Cancel deferred CI
        if: github.event_name == 'pull_request' && steps.ci-admission.outputs.run == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { cancelFromJob } = require(process.env.GITHUB_WORKSPACE + '/.ci-admission/.github/scripts/ci-scheduling');
            await cancelFromJob({ github, context, core });
      - name: Set timezone for Unix
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "America/Los_Angeles"
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}
      - name: Checkout Dolt
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Setup Git User
        uses: fregante/setup-git-user@v2
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Merge main into PR
        id: merge_main
        run: |
          git fetch --all --unshallow
          git merge origin/main --no-commit --no-ff
          if [ $? -ne 0 ]; then
            echo "Skipping the remainder of the workflow due to a merge conflict."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Merge performed successfully, continuing workflow."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') }}

      - name: Check for a DoltgreSQL PR link
        id: check_doltgresql_pr
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') && (steps.merge_main.outputs.skip == 'false') }}
        run: |
          PR_DESCRIPTION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number != '' && github.event.pull_request.number || github.event.issue.number }})
          COMMENTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number != '' && github.event.pull_request.number || github.event.issue.number }}/comments)
          echo "$PR_DESCRIPTION$COMMENTS"
          if echo "$PR_DESCRIPTION$COMMENTS" | grep -q "github.com/dolthub/doltgresql/pull/"; then
            echo "comment_exists=true" >> $GITHUB_OUTPUT
            echo "DoltgreSQL PR link exists"
          else
            echo "comment_exists=false" >> $GITHUB_OUTPUT
            echo "DoltgreSQL PR link does not exist"
          fi

      - name: Install Go
        uses: actions/setup-go@v5
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') && (steps.merge_main.outputs.skip == 'false') }}
        with:
          go-version-file: go/go.mod

      - name: Clone DoltgreSQL repository
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') && (steps.merge_main.outputs.skip == 'false' && steps.check_doltgresql_pr.outputs.comment_exists == 'false') }}
        run: git clone https://github.com/dolthub/doltgresql.git

      - name: Build DoltgreSQL's parser
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') && (steps.merge_main.outputs.skip == 'false' && steps.check_doltgresql_pr.outputs.comment_exists == 'false') }}
        run: |
          cd doltgresql
          ./postgres/parser/build.sh

      - name: Test DoltgreSQL against main
        id: test_doltgresql_main
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') && (steps.merge_main.outputs.skip == 'false' && steps.check_doltgresql_pr.outputs.comment_exists == 'false') }}
        continue-on-error: true
        run: |
          cd doltgresql
          go get github.com/dolthub/dolt/go@main
          go mod tidy
          cd testing/go
          go test ./... --count=1 -skip Replication

      - name: Test DoltgreSQL against PR
        if: ${{ (github.event_name != 'pull_request' || steps.ci-admission.outputs.run == 'true') && (steps.merge_main.outputs.skip == 'false' && steps.check_doltgresql_pr.outputs.comment_exists == 'false' && steps.test_doltgresql_main.outcome == 'success') }}
        run: |
          cd doltgresql
          git reset --hard
          go mod edit -replace github.com/dolthub/dolt/go=../go
          go mod tidy
          cd testing/go
          go test ./... --count=1 -skip Replication
